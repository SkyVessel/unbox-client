name: Beta profiles Windows build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        default: v0.2.25
      resources_sha256:
        required: true
      verify_only:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    if: ${{ !inputs.verify_only }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download pinned release resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED: ${{ inputs.resources_sha256 }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid tag' }
          if ($env:EXPECTED -notmatch '^[a-f0-9]{64}$') { throw 'Invalid digest' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern beta-resources.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Resource download failed' }
          $zip = Join-Path $env:RUNNER_TEMP 'beta-resources.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:EXPECTED) { throw 'Resource digest mismatch' }
          Expand-Archive $zip -DestinationPath src-tauri/resources -Force
      - run: python scripts/verify-client-bundle.py
      - run: python scripts/verify-beta-bundle.py
      - run: npm ci
      - run: npm run build
      - name: Prepare Windows icon
        run: npm run tauri -- icon src-tauri/icons/icon.png --output src-tauri/icons
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run tauri -- build --debug --config src-tauri/tauri.windows-testing.conf.json --bundles nsis
      - run: python scripts/verify-windows-gui.py src-tauri/target/debug/unbox-client.exe
      - uses: actions/upload-artifact@v4
        with:
          name: unbox-beta-windows
          path: src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  installer-smoke:
    if: ${{ inputs.verify_only }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install old and new versions into a disposable folder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED: ${{ inputs.resources_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'unbox-update-fixture'
          $old = Join-Path $env:RUNNER_TEMP 'unbox-old.exe'
          Invoke-WebRequest 'https://printoria.printoria-studio.workers.dev/unbox/releases/v0.2.22/Unbox.Client_0.2.22_windows-x64-setup.exe' -OutFile $old
          $install = Start-Process $old -ArgumentList @('/S', "/D=$fixture") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Old installation failed' }
          $exe = Join-Path $fixture 'unbox-client.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike '0.2.22*') { throw 'Wrong previous version' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*windows-x64-setup.exe' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'New installer download failed' }
          $new = Get-ChildItem $env:RUNNER_TEMP -Filter '*windows-x64-setup.exe' | Select-Object -First 1
          if ((Get-FileHash $new.FullName -Algorithm SHA256).Hash.ToLower() -ne $env:EXPECTED) { throw 'Installer digest mismatch' }
          $install = Start-Process $new.FullName -ArgumentList @('/S', "/D=$fixture") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'New installation failed' }
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike '0.2.25*') { throw 'Wrong updated version' }
          $integrity = Get-Content (Join-Path $fixture 'resources/beta-release-integrity.json') -Raw | ConvertFrom-Json
          foreach ($group in @($integrity.stable, $integrity.beta)) {
            foreach ($item in $group.PSObject.Properties) {
              $path = Join-Path $fixture ('resources/' + $item.Name)
              if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $item.Value) { throw "Installed resource mismatch: $($item.Name)" }
            }
          }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Updated launcher failed to stay running' }
          Stop-Process -Id $app.Id
          Write-Output 'Windows 0.2.22 to 0.2.25 installation, old/Beta resource integrity and launcher startup passed.'
